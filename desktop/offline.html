<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sellybot · مفيش اتصال</title>
<!-- Shown by the app when sellybot.online can't be reached. It retries by itself every few seconds and as soon as Windows says the
     internet is back, then returns to the page the owner was on (?back=). -->
<style>
  :root{--bg:#fff8f3;--card:#ffffff;--ink:#3a2a20;--mute:#8a7768;--brand:#e8774a;--line:#f1e3d8}
  @media (prefers-color-scheme: dark){:root{--bg:#17120f;--card:#221b17;--ink:#f3e9e2;--mute:#b6a497;--line:#3a2e27}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;display:grid;place-items:center;padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:36px 32px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(58,42,32,.08)}
  .logo{width:72px;height:72px;margin:0 auto 18px;display:block}
  .plug{font-size:40px;line-height:1;margin-bottom:6px;animation:wob 2.4s ease-in-out infinite}
  @keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  h1{font-size:22px;margin:6px 0 10px}
  p{color:var(--mute);margin:0 0 22px;line-height:1.8;font-size:15px}
  button{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:12px 26px;font:inherit;font-weight:700;cursor:pointer}
  button:hover{filter:brightness(1.05)}
  small{display:block;margin-top:16px;color:var(--mute);font-size:13px;min-height:1.4em}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brand);margin-inline-start:6px;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.2}}
</style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 96 96" aria-hidden="true"><rect width="96" height="96" rx="22" fill="#fff8f3"/><g transform="translate(6 10)"><path d="M58 22c0-7-7-12-16-12S24 15 24 24s8 12 18 15" fill="none" stroke="#E8774A" stroke-width="9" stroke-linecap="round"/><path d="M26 54c0 7 7 12 16 12s18-5 18-14-8-12-18-15" fill="none" stroke="#3a2a20" stroke-width="9" stroke-linecap="round"/><path d="M58 22l8-6" stroke="#E8774A" stroke-width="5" stroke-linecap="round"/><path d="M26 54l-8 6" stroke="#3a2a20" stroke-width="5" stroke-linecap="round"/></g></svg>
    <div class="plug" aria-hidden="true">🔌</div>
    <h1>مفيش اتصال بالإنترنت</h1>
    <p>مش قادرين نوصل لـ Sellybot دلوقتي. اتأكد إن الإنترنت شغال، وهنرجع لوحدنا أول ما الاتصال يرجع.</p>
    <button id="retry" type="button">جرّب تاني</button>
    <small id="st"></small>
  </div>
<script>
  var q = new URLSearchParams(location.search).get("back") || "";
  var back = /^https?:\/\//.test(q) ? q : "https://sellybot.online/dashboard.html";
  var st = document.getElementById("st"), left = 10;
  function go() { st.innerHTML = "بنحاول نوصل<span class='dot'></span>"; location.replace(back); }
  document.getElementById("retry").onclick = go;
  addEventListener("online", go);
  setInterval(function () {
    if (--left <= 0) { left = 10; if (navigator.onLine) go(); }
    else st.textContent = navigator.onLine ? "هنجرّب تاني بعد " + left + " ثواني" : "مستنيين الإنترنت يرجع…";
  }, 1000);
</script>
</body>
</html>
