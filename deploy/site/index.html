<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>الشات</title>
<script>
  // The bare site address (no ?store=): a signed-in owner goes to the dashboard, everyone else to the landing page
  // (start.html, with «تسجيل الدخول» in its bar). Chat links (/?store=<store id>) stay here and open the chat.
  (function () {
    if (new URLSearchParams(location.search).get("store")) return;
    var landing = "start.html" + location.search + location.hash;
    fetch("api/auth.ashx?action=me", { credentials: "same-origin", cache: "no-store" })
      .then(function (r) { location.replace(r.ok ? "dashboard.html" : landing); })
      .catch(function () { location.replace(landing); });
  })();
</script>
<script>
  // Light / dark before the chat loads (the saved choice, otherwise light), so the page never flashes.
  (function () {
    var t = null; try { t = localStorage.getItem("sb-theme"); } catch (e) {}
    var dark = t === "dark";
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  })();
</script>
<style>
  html,body{margin:0;height:100%;background:#fff7ef;color-scheme:light}
  html[data-theme=dark],html[data-theme=dark] body{background:#1d1611;color-scheme:dark}
</style>
</head>
<body>
<!-- The chat opens right away on this page. The store comes from the link: ?store=<store id> -->
<script src="widget.js?v=20261117c" data-mode="page"></script>
</body>
</html>
