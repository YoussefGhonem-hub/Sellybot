<title>ريلز Sellybot · اتعلم الموقع في دقيقة</title>
<meta name="description" content="فيديوهات قصيرة بتعرّفك على Sellybot في 30 ثانية، وبتشرحلك خطوة بخطوة: إزاي ترفع داتا متجرك، وتربط Shopify و EasyOrders، وتضيف الشات لمتجرك، وتدير باقتك، وتغيّر شكل الشات، وتشغّل المساعد على الواتساب.">

<script src="ref.js"></script>
<style>
  :root{--brand:#e8774a;--brand2:#f5a25d;--pink:#e84a8a;--muted:rgba(255,255,255,.75);--glass:rgba(255,255,255,.14)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden;overscroll-behavior:none}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
  a{color:inherit}
  svg{display:block}

  /* ---- the feed: one reel per screen, snapping like Instagram / Facebook ---- */
  .feed{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
  .feed::-webkit-scrollbar{display:none}
  .reel{position:relative;height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;gap:18px;overflow:hidden}
  .bg{display:none;position:absolute;inset:-60px;background:var(--poster) center/cover no-repeat;filter:blur(46px) brightness(.32) saturate(1.3);transform:scale(1.1)}
  .stage{position:relative;width:100%;height:100%;overflow:hidden;background:#0b0b0b;z-index:1}
  /* contain, never cover: these videos explain the site, so nothing at their edges may be cut off */
  .stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  .tap{position:absolute;inset:0;z-index:2}

  /* the reel's text, over a dark gradient at the bottom */
  /* small over the video (name, title, «المزيد»), so it hides as little of the explanation as possible */
  .info{position:absolute;inset-inline:0;bottom:0;z-index:3;padding:64px 14px calc(16px + env(safe-area-inset-bottom));padding-inline-end:74px;
    background:linear-gradient(to bottom,transparent,rgba(0,0,0,.62) 42%,rgba(0,0,0,.9));pointer-events:none;transition:background .25s}
  .info>*{pointer-events:auto}
  .info.open{background:rgba(0,0,0,.9);padding-top:20px}
  .who{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .who .cta{margin-inline-start:auto}
  .av{width:34px;height:34px;border-radius:50%;background:#fff8f3;display:grid;place-items:center;flex:none;box-shadow:0 0 0 2px var(--brand)}
  .av svg{width:20px;height:20px}
  .who b{font-size:15px;display:inline-flex;align-items:center;gap:4px}
  .ok{width:15px;height:15px;color:#3897f0}
  .ep{display:block;font-size:12px;font-weight:600;color:var(--brand2);margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttl{font-size:16px;font-weight:700;line-height:1.5;margin:0;text-shadow:0 1px 8px rgba(0,0,0,.4);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cap{display:none;font-size:14px;line-height:1.8;color:var(--muted);margin:8px 0 0}
  .info.open .ttl{display:block}
  .info.open .cap{display:block;max-height:42vh;overflow-y:auto}
  .more{font-size:13px;font-weight:600;color:rgba(255,255,255,.85);margin-top:3px}
  .cta{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:linear-gradient(135deg,var(--brand),var(--pink));
    color:#fff;font-weight:700;font-size:13px;text-decoration:none;box-shadow:0 6px 18px rgba(232,74,138,.35);white-space:nowrap;flex:none}
  .cta svg{width:15px;height:15px}
  .cta.big{display:none}

  /* progress: fills from the right (RTL); tap or drag on it to jump */
  .bar{position:absolute;inset-inline:0;bottom:0;height:18px;z-index:4;display:flex;align-items:flex-end;cursor:pointer;touch-action:none}
  .bar i{display:block;width:100%;height:3px;background:rgba(255,255,255,.25);position:relative;transition:height .15s}
  .bar i b{position:absolute;inset:0;background:#fff;transform-origin:right center;transform:scaleX(0)}
  .bar:hover i,.bar.drag i{height:6px}

  /* big play icon (paused), buffering ring, double-tap heart */
  .mid{position:absolute;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none}
  .mid>*{grid-area:1/1}
  .play{width:78px;height:78px;border-radius:50%;background:rgba(0,0,0,.42);display:grid;place-items:center;opacity:0;transform:scale(.7);transition:opacity .2s,transform .25s cubic-bezier(.34,1.56,.64,1)}
  .play svg{width:34px;height:34px;margin-inline-end:-4px}
  .paused .play{opacity:1;transform:none}
  .spin{width:46px;height:46px;border-radius:50%;border:3.5px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .8s linear infinite;opacity:0;transition:opacity .2s}
  .wait .spin{opacity:1}
  @keyframes spin{to{transform:rotate(360deg)}}
  .burst{position:absolute;z-index:5;width:96px;height:96px;margin:-48px 0 0 -48px;pointer-events:none;color:#ff3b5c;animation:burst .9s ease-out forwards;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
  @keyframes burst{0%{transform:scale(.2) rotate(-12deg);opacity:0}15%{transform:scale(1.15) rotate(-12deg);opacity:1}30%{transform:scale(.95) rotate(-12deg)}70%{opacity:1;transform:scale(1) rotate(-12deg) translateY(0)}100%{opacity:0;transform:scale(1.1) rotate(-12deg) translateY(-70px)}}

  /* the browser kept the sound off (no tap yet): a pill at the top of the reel until the visitor touches the page */
  .unmute{position:absolute;top:calc(68px + env(safe-area-inset-top));inset-inline-start:50%;transform:translateX(50%);z-index:4;display:none;align-items:center;gap:7px;
    padding:8px 15px;border-radius:999px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:13.5px;font-weight:600;white-space:nowrap}
  .unmute svg{width:18px;height:18px}
  .blocked .muted .unmute{display:inline-flex}

  /* the actions column (left in RTL, like the Arabic apps) */
  .acts{position:absolute;inset-inline-end:8px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:5;display:flex;flex-direction:column;align-items:center;gap:16px}
  .act{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.5)}
  .act .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .15s}
  .act:active .ic{transform:scale(.88)}
  .act svg{width:26px;height:26px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.35))}
  .act.liked .ic{color:#ff3b5c}
  .act.liked .ic svg{animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{0%{transform:scale(.6)}100%{transform:none}}
  .act .off{display:none}
  .muted .act.snd .on{display:none}
  .muted .act.snd .off{display:block}

  /* top bar */
  .top{position:fixed;inset-inline:0;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 22px;
    background:linear-gradient(rgba(0,0,0,.6),transparent);pointer-events:none}
  .top>*{pointer-events:auto}
  .logo{display:flex;align-items:center;gap:7px;text-decoration:none;font-weight:700;font-size:17px}
  .logo .av{width:32px;height:32px;box-shadow:none}
  .logo span{color:var(--brand2)}
  .top h1{font-size:17px;margin:0;font-weight:700;display:flex;align-items:center;gap:6px}
  .top h1 svg{width:20px;height:20px}
  .sep{width:1px;height:20px;background:rgba(255,255,255,.3)}
  .space{flex:1}
  .start{padding:8px 14px;border-radius:999px;background:#fff;color:#1a1410;font-weight:700;font-size:13.5px;text-decoration:none;white-space:nowrap}

  /* up / down (desktop) */
  .arrows{display:none;position:fixed;inset-inline-start:26px;top:50%;transform:translateY(-50%);z-index:9;flex-direction:column;gap:12px}
  .arrows button{width:46px;height:46px;border-radius:50%;background:var(--glass);display:grid;place-items:center;transition:background .2s,opacity .2s}
  .arrows button:hover{background:rgba(255,255,255,.24)}
  .arrows button:disabled{opacity:.3;cursor:default}
  .arrows svg{width:24px;height:24px}

  /* the last screen */
  .end .card{position:relative;z-index:1;width:min(420px,calc(100% - 40px));text-align:center;padding:30px 24px;border-radius:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
  .end .av{width:62px;height:62px;margin:0 auto 14px}
  .end .av svg{width:36px;height:36px}
  .end h2{margin:0 0 6px;font-size:21px}
  .end p{margin:0 0 14px;color:var(--muted);line-height:1.8;font-size:14.5px}
  .soon{display:flex;align-items:center;gap:10px;text-align:start;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);margin:0 0 18px}
  .soon b{display:block;font-size:14px}
  .soon small{color:var(--muted);font-size:12.5px}
  .soon .n{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--pink));font-weight:700}
  .end .cta{margin:0}
  .again{display:block;margin:14px auto 0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:4px}

  .toast{position:fixed;bottom:calc(30px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);z-index:20;background:#fff;color:#1a1410;padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---- big screens: a 9:16 card in the middle, its blurred picture behind it, actions beside it ---- */
  @media (min-width:760px){
    .reel{padding:22px 0}
    .bg{display:block}
    .stage{width:auto;height:100%;aspect-ratio:9/16;max-width:calc(100vw - 260px);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
    .stage video{object-fit:contain}
    .info{padding-inline-end:16px;border-radius:0 0 16px 16px}
    .acts{position:relative;inset:auto;bottom:auto;align-self:flex-end;margin-bottom:34px;z-index:2}
    .act .ic{background:var(--glass)}
    .arrows{display:flex}
    .top{background:none;padding:18px 22px}
  }
  /* wide screens: the reel's text in a panel beside the video, not over it */
  @media (min-width:1240px){
    .stage{overflow:visible;border-radius:16px}
    .stage video{border-radius:16px}
    .bar{border-radius:0 0 16px 16px;overflow:hidden}
    /* inline-end in RTL = the left edge, so this sits to the right of the video (the actions column is on its left) */
    .info,.info.open{position:absolute;inset-inline-end:calc(100% + 28px);inset-inline-start:auto;bottom:24px;width:320px;padding:20px;border-radius:18px;
      background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .ttl{display:block;font-size:18px}
    .cap{display:block;max-height:none}
    .more,.who .cta{display:none}
    .cta.big{display:inline-flex;margin-top:16px;padding:10px 18px;font-size:14px}
  }
  @media (max-width:380px){.start{padding:7px 11px;font-size:12.5px}.top:not(.lst) .sep,.top:not(.lst) h1 span{display:none}}
  .top h1 span{white-space:nowrap}
  @media (max-width:440px){.top.lst .logo b,.top.lst .sep{display:none}}   /* ?list=…: the series' name needs the room on a phone */
  @media (prefers-reduced-motion:reduce){.feed{scroll-behavior:auto}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
/*
 * Sellybot's reels: short videos that show how to use the site. Public (no sign-in).
 * To add a reel: put the video in site/reels/ (vertical 1080x1920 MP4, H.264 + AAC, moov at the start), make its cover
 * (the first frame as a 720x1280 JPG) and add an entry here. Change v when a file is replaced: the files are cached a month.
 */
var REELS = [
  {
    id: "intro", src: "reels/06-intro.mp4", poster: "reels/06-intro.jpg", v: 1,
    series: "موظف المبيعات اللي مابينامش", ep: "تعرّف على Sellybot",
    title: "Sellybot: موظف مبيعات بيرد على زباينك 24 ساعة",
    text: "كل زبون بيستنى رد ممكن يضيع. Sellybot بيرد على زباينك في ثانية، ليل ونهار، على شات موقعك ورقم واتساب متجرك. بيرد من داتاك بس، ومابيألّفش أسعار ولا عروض، وانت اللي بتحدد بيقول إيه وبأسلوب إيه. بيتربط بـ Shopify و EasyOrders، ويأكد الطلبات على واتساب، ويفكّر الزبون بالسلة المتروكة، ويبلّغه لما المنتج يرجع. ومش لازم يكون عندك متجر: عيادات، أكاديميات، عقارات، مطاعم، شركات. 3 خطوات من غير مبرمج، وداتاك وزباينك في أمان.",
    cta: { label: "اعمل حسابك النهارده", href: "dashboard.html?signup=1" }
  },
  // Sellybot in 30 seconds: short ads (no "خطوة بخطوة" header), right after the intro for new visitors
  {
    id: "six", src: "reels/17-six.mp4", poster: "reels/17-six.jpg", v: 1,
    series: "Sellybot في 30 ثانية", ep: "6 حاجات بيعملهم Sellybot",
    title: "متجرك يرد على زباينك 24 ساعة من غير ولا موظف",
    text: "75 رسالة مستنية ردك، وبالليل بقوا 99+؟ Sellybot بيعمل 6 حاجات: يرد على أي سؤال في ثانية، وعلى موقعك والمسنجر والإنستجرام والواتساب من مكان واحد، ويفهم صور المنتجات اللي الزبون بيبعتها، ويتربط بمتجرك على Shopify أو EasyOrders، والزبون يطلب من جوه الشات على طول، ولو حبيت ترد بنفسك بيسيبلك المحادثة. كل ده من 1000 جنيه في الشهر بدل 1200، وسعرك ثابت أول 6 شهور لو اشتركت لحد 10 ديسمبر، وأول شهر ببلاش. ربط المتجر من باقة «الأساسية» والطلب من الشات من «المتقدمة»، والواتساب باشتراك شهري لوحده أو جوه باقة «الاقتصادية» (850 جنيه: الواتساب والمسنجر والإنستجرام وموقعك).",
    cta: { label: "جرّبه شهر ببلاش", href: "dashboard.html?signup=1" }
  },
  // the «دعوة تاجر» ad (61 s), for the new feature
  {
    id: "invite-ad", src: "reels/18-invite-ad.mp4", poster: "reels/18-invite-ad.jpg", v: 1,
    series: "ميزة جديدة", ep: "دعوة تاجر",
    title: "ادفع نص تمن اشتراكك، ومش لمرة واحدة بس",
    text: "عندنا ميزة جديدة اسمها «دعوة تاجر». في «💎 باقتي» هتلاقي لينك الدعوة بتاعك: انسخه أو ابعته على واتساب بضغطة لأي صاحب متجر تعرفه. صاحبك يسجّل من لينكك ويبدأ بشهر تجربة ببلاش، وأول ما يشترك في أي باقة، انت تاخد شهر بخصم 50%. عشرة اشتركوا؟ يبقى عشر شهور بنص السعر، شهر ورا شهر. ومش محتاج تعمل حاجة: لما تجدد، المبلغ بيظهرلك بعد الخصم على طول، بدل 1000 تدفع 500. وفي نفس المكان بتشوف مين سجّل من لينكك ومين اشترك، وكام شهر خصم مستنيك. الخصم على الباقة بس، مش على الواتساب ولا الرسايل الإضافية.",
    cta: { label: "خد لينك الدعوة", href: "dashboard.html#plan" }
  },
  {
    id: "one-place", src: "reels/16-one-place.mp4", poster: "reels/16-one-place.jpg", v: 1,
    series: "Sellybot في 30 ثانية", ep: "كل رسايلك في مكان واحد",
    title: "رسايل زباينك جاية من كل حتة؟ Sellybot بيرد عليها كلها",
    text: "أسئلة زباينك بتتجمع على الواتساب والمسنجر والإنستجرام، ومئات الرسايل مستنية ردك. Sellybot بيرد عليها كلها من مكان واحد، في ثواني و24 ساعة، ويفهم حتى صور المنتجات. اربط متجرك على Shopify أو EasyOrders، ويرد من منتجاتك وأسعارك والمخزون أول بأول. والزبون يسأل «طلبي فين؟» ويعرف حالة أوردره، أو يطلب من جوه الشات. ولو رديت إنت بنفسك، بيسكت ويسيبلك المحادثة. جرّبه شهر ببلاش: 500 رسالة ومن غير كارت. المسنجر والإنستجرام من نفس رصيد باقتك، والواتساب باشتراك شهري لوحده أو جوه باقة «الاقتصادية».",
    cta: { label: "جرّبه شهر ببلاش", href: "dashboard.html?signup=1" }
  },
  {
    id: "any-business", src: "reels/09-any-business.mp4", poster: "reels/09-any-business.jpg", v: 1,

    sndOff: '<svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5l5 4v-13l-5 4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>'
  };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  // ---- build the reels (+ the closing screen) ----
  var likes = {}; try { likes = JSON.parse(localStorage.getItem("sb-reel-likes") || "{}") || {}; } catch (e) {}
  REELS.forEach(function (r, i) {
    var s = document.createElement("section");
    s.className = "reel muted paused"; s.dataset.i = i; s.id = "r-" + r.id;
    s.setAttribute("aria-label", r.title);
    s.style.setProperty("--poster", 'url("' + r.poster + "?v=" + r.v + '")');
    s.innerHTML =
      '<div class="bg" aria-hidden="true"></div>' +
      '<div class="stage">' +
        '<video playsinline webkit-playsinline loop muted preload="none" poster="' + esc(r.poster + "?v=" + r.v) + '" aria-label="' + esc(r.title) + '"></video>' +
        '<div class="tap"></div>' +
        '<div class="mid"><span class="play">' + SVG.play + '</span><span class="spin"></span></div>' +
        '<button type="button" class="unmute">' + SVG.sndOff.replace('class="off"', "") + 'دوس على الشاشة عشان تسمع الصوت</button>' +
        '<div class="info">' +
          '<div class="who"><span class="av">' + SVG.logo + '</span><b>Sellybot ' + SVG.ok + '</b>' +
            '<a class="cta" href="' + esc(r.cta.href) + '">' + esc(r.cta.label) + SVG.arrow + '</a></div>' +
          '<span class="ep">' + esc(r.ep) + " · " + esc(r.series) + '</span>' +
          '<p class="ttl">' + esc(r.title) + '</p>' +
          '<p class="cap">' + esc(r.text) + '</p><button type="button" class="more">المزيد</button>' +
          '<a class="cta big" href="' + esc(r.cta.href) + '">' + esc(r.cta.label) + SVG.arrow + '</a>' +
        '</div>' +
        '<div class="bar" role="slider" aria-label="مكان الفيديو" tabindex="0"><i><b></b></i></div>' +
      '</div>' +
      '<div class="acts">' +
        '<button type="button" class="act like' + (likes[r.id] ? " liked" : "") + '" aria-pressed="' + !!likes[r.id] + '"><span class="ic">' + (likes[r.id] ? SVG.heart : SVG.heartO) + '</span>عجبني</button>' +
        '<button type="button" class="act shr"><span class="ic">' + SVG.share + '</span>شارك</button>' +
        '<button type="button" class="act snd" aria-label="الصوت"><span class="ic">' + SVG.sndOn + SVG.sndOff + '</span>الصوت</button>' +
      '</div>';
    feed.appendChild(s);
  });
  var end = document.createElement("section"), L = LIST && LISTS[LIST];
  end.className = "reel end"; end.dataset.i = REELS.length; end.id = "r-end";
  end.innerHTML =
    '<div class="bg" aria-hidden="true" style="--poster:url(' + REELS[REELS.length - 1].poster + ')"></div>' +
    '<div class="card"><span class="av">' + SVG.logo + '</span>' +
    (L ? '<h2>شفت كل فيديوهات ' + esc(L.name) + ' 🎉</h2>' +
      '<p>جرّب اللي اتعلمته على متجرك دلوقتي، ولو محتار في حاجة اسأل سيلّي في اللوحة.</p>' +
      (L.soon ? '<div class="soon"><span class="n" aria-hidden="true">🎬</span><span><b>فيديوهات جديدة قريب</b><small>' + esc(L.soon) + '</small></span></div>' : '') +
      '<a class="cta" href="' + esc(L.back) + '">' + esc(L.backLabel) + SVG.arrow + '</a>'
    : '<h2>شفت كل حلقات «خطوة بخطوة» 🎉</h2>' +
      '<p>جرّب اللي اتعلمته على متجرك دلوقتي، شهر كامل ببلاش ومن غير كارت.</p>' +
      '<div class="soon"><span class="n" aria-hidden="true">🎬</span><span><b>حلقات جديدة قريب</b><small>تابعها هنا في الريلز</small></span></div>' +
      '<a class="cta" href="dashboard.html?signup=1">ابدأ تجربتك المجانية' + SVG.arrow + '</a>') +
    '<button type="button" class="again" id="again">شوف من الأول</button></div>';
  if (L) {   // the header: the series' name, and the way back to «متجري» instead of «ابدأ مجانًا»
    document.querySelector(".top").classList.add("lst"); document.querySelector(".top h1 span").textContent = L.name;
    var st = document.querySelector(".top .start"); st.textContent = L.backLabel; st.href = L.back;
    document.title = L.name + " · ريلز Sellybot";
  }
  feed.appendChild(end);

  var secs = [].slice.call(feed.querySelectorAll(".reel"));
  var vids = secs.slice(0, REELS.length).map(function (s) { return s.querySelector("video"); });
  // sound is on unless the visitor turned it off. Browsers allow it only after a tap (Chrome also when the page was
  // opened by a click, e.g. «🎬 فيديو الشرح» in «متجري»); when refused, blocked = true until the first touch (wake below).
  var cur = -1, wantSound = true, blocked = false, wokeAt = 0, seen = {};
  try { wantSound = sessionStorage.getItem("sb-reel-sound") !== "0"; } catch (e) {}

  function toast(t) { var el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove("show"); }, 2000); }
  function attach(i, preload) {
    var v = vids[i]; if (!v) return;
    if (!v.getAttribute("src")) v.src = REELS[i].src + "?v=" + REELS[i].v;
    if (preload === "auto" || v.preload === "none") v.preload = preload;
  }
  function soundUI() {
    secs.forEach(function (s, i) { s.classList.toggle("muted", !vids[i] || vids[i].muted); });
    document.body.classList.toggle("blocked", blocked);
  }

  // play the reel on screen: with sound, unless the visitor turned it off or the browser refuses it
  // (then muted, with the «دوس على الشاشة» pill)
  function play(i) {
    var v = vids[i]; if (!v) return;
    v.muted = !wantSound || blocked;
    var p = v.play();
    if (p && p.catch) p.catch(function (e) {
      if (i !== cur) return;   // swiped away before it started
      if (!v.muted && e && e.name === "NotAllowedError") { blocked = true; v.muted = true; soundUI(); v.play().catch(function () { secs[i].classList.add("paused"); }); }
      else secs[i].classList.add("paused");
    });
    soundUI();
  }
  // the browser kept the sound off: the visitor's first tap / click / key anywhere turns it on (a tap on the video
  // then only turns the sound on, it doesn't pause it). Links leave the page, and the sound buttons do it themselves.
  function wake(e) {
    if (!blocked || !wantSound || cur < 0 || cur >= vids.length) return;
    var t = e.target && e.target.closest ? e.target : document.body;
    if (t.closest(".unmute,.snd,a[href]")) return;
    if (e.type === "keydown" && (e.key === "Escape" || e.key === "m" || e.key === "M")) return;
    wokeAt = Date.now();
    setSound(true, t.closest(".bar") ? "seek" : "tap");
  }
  document.addEventListener("click", wake, true);
  document.addEventListener("keydown", wake, true);
  function activate(i) {
    if (i === cur) return;
    cur = i;
    vids.forEach(function (v, j) { if (j !== i && !v.paused) v.pause(); });
    document.getElementById("prev").disabled = i <= 0;
    document.getElementById("next").disabled = i >= secs.length - 1;
    if (i >= REELS.length) { history.replaceState(null, "", "#end"); return; }
    attach(i, "auto");
    if (i + 1 < REELS.length) attach(i + 1, "metadata");
    history.replaceState(null, "", "#" + REELS[i].id);
    play(i);
  }
  function go(i) {
    i = Math.max(0, Math.min(secs.length - 1, i));
    feed.scrollTo({ top: secs[i].offsetTop, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }

  // which reel is on screen
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting && e.intersectionRatio >= 0.6) activate(+e.target.dataset.i); });
  }, { root: feed, threshold: [0.6] });
  secs.forEach(function (s) { io.observe(s); });

  // ---- each reel's controls ----
  vids.forEach(function (v, i) {
    var s = secs[i], bar = s.querySelector(".bar"), fill = bar.querySelector("b"), r = REELS[i];
    v.addEventListener("playing", function () {
      s.classList.remove("paused", "wait");
      if (!seen[r.id]) { seen[r.id] = true; if (window.sbTrack) window.sbTrack("ViewContent", { content_name: r.title, content_category: "reels" }); }
    });
    v.addEventListener("pause", function () { s.classList.add("paused"); });
    v.addEventListener("waiting", function () { s.classList.add("wait"); });
    v.addEventListener("canplay", function () { s.classList.remove("wait"); });
    v.addEventListener("error", function () { s.classList.remove("wait"); if (i === cur) toast("الفيديو ماتحمّلش، اتأكد من النت وجرّب تاني"); });
    v.addEventListener("volumechange", soundUI);

    // tap = pause / play, double tap = like (with a heart where you tapped)
    var tapT = null;
    s.querySelector(".tap").addEventListener("click", function (e) {
      if (Date.now() - wokeAt < 400) return;   // that tap turned the sound on
      if (tapT) { clearTimeout(tapT); tapT = null; like(i, true, e); return; }
      tapT = setTimeout(function () { tapT = null; if (v.paused) { v.play().catch(function () {}); } else v.pause(); }, 230);
    });
    s.querySelector(".unmute").onclick = function () { setSound(true); };
    s.querySelector(".snd").onclick = function () { setSound(v.muted); };
    s.querySelector(".like").onclick = function () { like(i, !likes[r.id]); };
    s.querySelector(".shr").onclick = function () { share(r); };
    s.querySelector(".more").onclick = function () {
      var open = s.querySelector(".info").classList.toggle("open");
      this.textContent = open ? "أقل" : "المزيد";
    };

    // progress, and jumping by tapping / dragging the bar (it runs right to left)
    function at(x) { var b = bar.getBoundingClientRect(); return Math.max(0, Math.min(1, (b.right - x) / b.width)); }
    bar.addEventListener("pointerdown", function (e) {
      if (!v.duration) return;
      bar.setPointerCapture(e.pointerId); bar.classList.add("drag");
      v.currentTime = at(e.clientX) * v.duration;
      bar.onpointermove = function (m) { v.currentTime = at(m.clientX) * v.duration; fill.style.transform = "scaleX(" + at(m.clientX) + ")"; };
    });
    bar.addEventListener("pointerup", function () { bar.classList.remove("drag"); bar.onpointermove = null; });
    bar.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") { v.currentTime = Math.min(v.duration || 0, v.currentTime + 5); e.preventDefault(); }
      if (e.key === "ArrowRight") { v.currentTime = Math.max(0, v.currentTime - 5); e.preventDefault(); }
    });
    v.addEventListener("loadedmetadata", function () { bar.setAttribute("aria-valuemax", Math.round(v.duration)); });
  });
  (function tick() {
    if (cur >= 0 && cur < vids.length) {
      var v = vids[cur], fill = secs[cur].querySelector(".bar b");
      if (v.duration && !secs[cur].querySelector(".bar").classList.contains("drag")) fill.style.transform = "scaleX(" + (v.currentTime / v.duration) + ")";
    }
    requestAnimationFrame(tick);
  })();

  // how: "tap" = the first touch after the browser kept the sound off (no message if it's still refused),
  // "seek" = that touch was on the progress bar (keep the spot it jumped to)
  function setSound(on, how) {
    // the first sound after the browser kept it off starts the reel over, so the voice is heard from the beginning
    // (not after 20 s: they were following the captions)
    var restart = on && blocked && how !== "seek";
    blocked = false; wantSound = on;
    try { sessionStorage.setItem("sb-reel-sound", on ? "1" : "0"); } catch (e) {}
    vids.forEach(function (v) { v.muted = !on; });
    if (on && cur >= 0 && cur < vids.length) {
      // the browser may still refuse sound without a real tap: then keep it playing muted and say so
      var v = vids[cur];
      if (restart && v.currentTime < 20) v.currentTime = 0;
      var p = v.play();
      if (p && p.catch) p.catch(function (e) {
        if (e && e.name !== "NotAllowedError") return;
        blocked = true; v.muted = true; soundUI();
        v.play().catch(function () {});
        if (!how) toast("دوس على زرار الصوت تاني عشان يشتغل 🔊");
      });
    }
    soundUI();
  }
  function like(i, on, e) {
    var r = REELS[i], b = secs[i].querySelector(".like");
    if (e) {   // the heart where the double tap was
      var h = document.createElement("span"), box = secs[i].querySelector(".stage").getBoundingClientRect();
      h.className = "burst"; h.innerHTML = SVG.heart; h.style.left = (e.clientX - box.left) + "px"; h.style.top = (e.clientY - box.top) + "px";
      secs[i].querySelector(".stage").appendChild(h); setTimeout(function () { h.remove(); }, 950);
    }
    if (on) likes[r.id] = 1; else delete likes[r.id];
    try { localStorage.setItem("sb-reel-likes", JSON.stringify(likes)); } catch (x) {}
    b.classList.toggle("liked", !!on); b.setAttribute("aria-pressed", !!on);
    b.querySelector(".ic").innerHTML = on ? SVG.heart : SVG.heartO;
  }
  function share(r) {
    var url = location.origin + location.pathname + location.search + "#" + r.id;
    if (navigator.share) { navigator.share({ title: r.title, text: r.title + " · Sellybot", url: url }).catch(function () {}); return; }
    var done = function () { toast("اتنسخ لينك الريل ✅"); };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function () { prompt("انسخ اللينك:", url); });
    else prompt("انسخ اللينك:", url);
  }

  // keyboard (computer): ↓ ↑ to move, space to pause, M for sound
  document.addEventListener("keydown", function (e) {
    if (e.target.closest && e.target.closest(".bar")) return;
    if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === "j") { go(cur + 1); e.preventDefault(); }
    else if (e.key === "ArrowUp" || e.key === "PageUp" || e.key === "k") { go(cur - 1); e.preventDefault(); }
    else if (e.key === " " && cur < vids.length && !(e.target.closest && e.target.closest("button,a"))) {
      var v = vids[cur];
      if (Date.now() - wokeAt > 400) { if (v.paused) v.play().catch(function () {}); else v.pause(); }   // (not when that key just turned the sound on)
      e.preventDefault();
    }
    else if ((e.key === "m" || e.key === "M") && cur < vids.length) setSound(vids[cur].muted);
  });
  document.getElementById("prev").onclick = function () { go(cur - 1); };
  document.getElementById("next").onclick = function () { go(cur + 1); };
  document.getElementById("again").onclick = function () { go(0); };
  // leaving the tab pauses; coming back plays again
  document.addEventListener("visibilitychange", function () {
    if (cur < 0 || cur >= vids.length) return;
    if (document.hidden) vids[cur].pause(); else vids[cur].play().catch(function () {});
  });

  // a shared link (reels.html#shopify) opens on its reel, also when it's opened while the page is already showing.
  // A removed reel's old link opens the reel that replaced it.
  var MOVED = { "all-channels": "one-place" };
  function indexOf(hash) { var h = (hash || "").slice(1), at = -1; h = MOVED[h] || h; REELS.forEach(function (r, i) { if (r.id === h) at = i; }); return h === "end" ? REELS.length : at; }
  var start = indexOf(location.hash);
  if (start > 0) feed.scrollTop = secs[start].offsetTop;
  window.addEventListener("hashchange", function () { var i = indexOf(location.hash); if (i >= 0 && i !== cur) go(i); });
})();
</script>
