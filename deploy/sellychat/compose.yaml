# SellyChat on its own Linux server: the image built from ./Dockerfile (Chatwoot community edition + Sellybot's name),
# Postgres, Redis, and Caddy in front for HTTPS. Secrets live in .env (made by setup.sh, never in git).
name: sellychat

x-app: &app
  build: .
  image: sellychat:local
  env_file: .env
  environment: [NODE_ENV=production, RAILS_ENV=production, INSTALLATION_ENV=docker]
  volumes: [storage:/app/storage]
  depends_on: [postgres, redis]
  restart: always

services:
  rails:
    <<: *app
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
  sidekiq:
    <<: *app
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment: [POSTGRES_DB=chatwoot, POSTGRES_USER=postgres]
    env_file: .env.db
    volumes: [postgres:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    restart: always
    env_file: .env
    command: ['sh', '-c', 'redis-server --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis:/data]
  caddy:
    image: caddy:2-alpine
    restart: always
    ports: ['80:80', '443:443']
    env_file: .env
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy:/data]
    depends_on: [rails]

volumes:
  storage:
  postgres:
  redis:
  caddy:
